[project]
name = "application-copilot-evidence"
version = "0.2.0"
description = "Local evidence workbench; citations verify provenance, not truth."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.4", "uvicorn==0.38.0", "python-multipart==0.0.22",
  "pydantic==2.12.5", "chromadb==1.5.9", "bm25s==0.3.13", "scipy==1.17.0",
  "sentence-transformers==5.1.2", "transformers==4.57.1",
  "huggingface-hub==0.36.0", "torch==2.8.0+cpu", "pypdf==6.19.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10", "httpx==0.28.1", "pyyaml==6.0.3"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["real_models: explicit pinned local model and real index integration"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
