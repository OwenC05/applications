name: application-copilot-evidence
services:
  app:
    build: .
    init: true
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      COPILOT_CHROMA_HOST: chroma
      COPILOT_CHROMA_PORT: "8000"
      COPILOT_DATA_DIR: /data
      COPILOT_MODEL_DIR: /models
      COPILOT_PORT: "3001"
    volumes:
      - evidence:/data
      - models:/models
    depends_on:
      chroma:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 3g
    cpus: 2
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  worker:
    build: .
    init: true
    command: ["python", "-m", "copilot", "worker"]
    environment:
      COPILOT_CHROMA_HOST: chroma
      COPILOT_CHROMA_PORT: "8000"
      COPILOT_DATA_DIR: /data
      COPILOT_MODEL_DIR: /models
    volumes:
      - evidence:/data
      - models:/models:ro
    depends_on:
      chroma:
        condition: service_started
    mem_limit: 3g
    cpus: 2
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
    restart: unless-stopped
  chroma:
    image: chromadb/chroma:1.5.9@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    environment:
      ANONYMIZED_TELEMETRY: "False"
    volumes:
      - chroma:/data
    mem_limit: 1g
    cpus: 1
    restart: unless-stopped
volumes:
  evidence:
  models:
  chroma:
